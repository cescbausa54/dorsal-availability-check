name: Vigila dorsals

# Cada execució vigila ~50 minuts i en acabar engega la següent (cadena contínua).
# El cron només fa de xarxa de seguretat per si la cadena es trenca.
# Per aturar-ho del tot: Actions → Vigila dorsals → "..." → Disable workflow.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # per poder engegar la següent execució

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instal·la dependències
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Comprova la pàgina (bucle de ~50 minuts)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PYTHONUNBUFFERED: "1"   # mostra el log en directe
          CHECK_INTERVAL: "60"
          LOOP_MINUTES: "50"
        run: python monitor.py --loop

      - name: Desa l'estat si ha canviat
        run: |
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state
            git commit -m "Actualitza estat"
            git pull --rebase && git push
          fi

      # No s'executa si cancel·les l'execució a mà, així pots aturar la cadena.
      - name: Engega la següent execució
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref main --repo ${{ github.repository }}
