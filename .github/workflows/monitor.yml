name: Vigila dorsals

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub pot endarrerir-ho uns minuts
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instal·la dependències
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Comprova la pàgina (bucle de ~9 minuts)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PYTHONUNBUFFERED: "1"   # mostra el log en directe
          CHECK_INTERVAL: "60"
          LOOP_MINUTES: "9"
        run: python monitor.py --loop

      - name: Desa l'estat si ha canviat
        run: |
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state
            git commit -m "Actualitza estat"
            git pull --rebase && git push
          fi
